name: GPU CI requirement

# No path filters: every PR needs an explicit required/not-required decision.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [GPU CI pilot]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: gpu-ci-gate-${{ github.event.pull_request.number && format('pull-request/{0}', github.event.pull_request.number) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  assess:
    name: Assess GPU CI requirement
    if: >-
      github.repository == 'NVIDIA/cudf-spark-examples' &&
      (github.event_name == 'pull_request_target' ||
       startsWith(github.event.workflow_run.head_branch, 'pull-request/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both events use trusted base/default-branch code. Never check out the PR here.
      - name: Checkout trusted gate policy
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assess required suites and approved results
        uses: actions/github-script@v8
        with:
          script: |
            const {assess} = require('./.github/scripts/gpu-ci.cjs');
            await assess({github, context, core});
