name: GPU CI pilot

# copy-pr-bot pushes the approved PR head here, not a synthetic merge commit.
on:
  push:
    branches:
      - 'pull-request/[0-9]+'
    paths:
      - .github/workflows/gpu-ci*.yml
      - examples/UDF-Examples/RAPIDS-accelerated-UDFs/**

permissions:
  contents: read

concurrency:
  group: gpu-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  build:
    name: Build GPU test artifacts
    if: github.repository == 'NVIDIA/cudf-spark-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Checkout approved source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '8'
      - name: Build non-native UDF examples
        working-directory: examples/UDF-Examples/RAPIDS-accelerated-UDFs
        run: |
          set -euo pipefail
          mvn -B -ntp clean package
          printf '%s\n' "$GITHUB_SHA" > target/gpu-ci-source-sha.txt
      - name: Upload test artifacts
        id: artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gpu-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/rapids-4-spark-udf-examples*.jar
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/dependency/rapids-4-spark*.jar
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/gpu-ci-source-sha.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  gpu:
    name: GPU sanity (${{ matrix.run }})
    needs: build
    # Temporary validation: independent runs share one CPU build and each retain queue fallback.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        run: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: write
    steps:
      # Only the shared action receives write access; this job never executes PR code.
      - name: Run GPU tests with queue fallback
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback@main
        with:
          workflow: gpu-ci-worker.yml
          # Full-SHA approval covers this copied branch's worker definition as well as its tests.
          workflow-ref: ${{ github.ref_name }}
          source-ref: ${{ github.ref }}
          source-sha: ${{ github.sha }}
          workload: >-
            {"artifact-id":"${{ needs.build.outputs.artifact-id }}","fail-worker":${{ matrix.run == 1 }}}
          queue-timeout-minutes: '10'
          execution-timeout-minutes: '15'
          # Latest-driver pools, ordered by the observed average scheduling wait.
          runners: >-
            [
              {"group":"nv-gpu-amd64-rtxpro6000-1gpu","labels":"linux-amd64-gpu-rtxpro6000-latest-1"},
              {"group":"nv-gpu-amd64-h100-1gpu","labels":"linux-amd64-gpu-h100-latest-1"},
              {"group":"nv-gpu-amd64-a100-1gpu","labels":"linux-amd64-gpu-a100-latest-1"},
              {"group":"nv-gpu-general","labels":"linux-amd64-gpu-l4-latest-1"}
            ]
