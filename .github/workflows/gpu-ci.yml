name: GPU CI

# For PRs targeting main, a maintainer approves /ok to test <full-head-SHA>.
# copy-pr-bot pushes that exact commit here; each new head needs new approval.
# Selection checks the full PR diff against .github/gpu-ci-suites.json:
# Bot configuration and the catalog itself are not workload-triggering paths.
# UDF jobs: ["build", "gpu-test"] are workflow IDs: CPU artifact build and UDF tests.
# Both must succeed when selected; the catalog does not create jobs or choose runners.
# Markdown-only UDF edits are excluded; shared CI workflow changes still select all enabled suites.
# To pause a suite, set enabled: false and record the reason in its comment.
# Disabled suites skip their jobs even for shared paths; selection and the gate still run.
# - No matching path: skip build/GPU jobs; pass the gate if selection succeeds.
# - Matching path: build once, run the selected tests, and require all to pass.
# Even unaffected PRs need approval; no gate is reported before the copied push.
on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gpu-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  select:
    name: Select GPU test suites
    if: github.repository == 'NVIDIA/cudf-spark-examples'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      required-jobs: ${{ steps.select.outputs.required-jobs }}
    steps:
      - name: Checkout approved source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select suites from the full PR diff
        id: select
        uses: NVIDIA/spark-rapids-common/workflow-suite-selector@main
        with:
          catalog-path: .github/gpu-ci-suites.json
          base-branch: main
          selector-job: select

  build:
    name: Build UDF test artifacts
    needs: select
    if: contains(fromJSON(needs.select.outputs.suites), 'udf')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Checkout approved source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pull published native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          dockerfile=examples/UDF-Examples/RAPIDS-accelerated-UDFs/Dockerfile
          checksum=$(sha256sum "$dockerfile" | cut -d ' ' -f 1)
          image="ghcr.io/${GITHUB_REPOSITORY,,}/udf-native-toolchain:dockerfile-$checksum"

          # No publishing credentials in PR builds. A new Dockerfile builds locally until published.
          if timeout 5m docker pull --platform linux/amd64 "$image"; then
            docker tag "$image" udf-ci:local
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
            printf 'Native toolchain: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Published native toolchain unavailable; building the checked-out Dockerfile."
            printf 'Native toolchain: local build (published image unavailable).\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Docker Buildx
        if: steps.toolchain.outputs.available != 'true'
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build cached native toolchain
        if: steps.toolchain.outputs.available != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: examples/UDF-Examples/RAPIDS-accelerated-UDFs
          platforms: linux/amd64
          load: true
          tags: udf-ci:local
          cache-from: type=gha,scope=udf-native-toolchain
          cache-to: type=gha,scope=udf-native-toolchain,mode=max,ignore-error=true
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: '2'
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: udf-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/UDF-Examples/RAPIDS-accelerated-UDFs/pom.xml') }}
          restore-keys: |
            udf-maven-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache native compilation and dependency sources
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/udf-native/ccache
            ~/.cache/udf-native/cpm
          key: udf-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/UDF-Examples/RAPIDS-accelerated-UDFs/Dockerfile', 'examples/UDF-Examples/RAPIDS-accelerated-UDFs/pom.xml') }}-${{ hashFiles('examples/UDF-Examples/RAPIDS-accelerated-UDFs/src/main/cpp/**') }}
          restore-keys: |
            udf-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/UDF-Examples/RAPIDS-accelerated-UDFs/Dockerfile', 'examples/UDF-Examples/RAPIDS-accelerated-UDFs/pom.xml') }}-
      - name: Build all UDF examples
        working-directory: examples/UDF-Examples/RAPIDS-accelerated-UDFs
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2/repository" "$HOME/.cache/udf-native/ccache" "$HOME/.cache/udf-native/cpm"
          # Compile once without a GPU; keep caches outside the clean build directory.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.m2/repository:/cache/maven" \
            -v "$HOME/.cache/udf-native:/cache/native" \
            -w /workspace/examples/UDF-Examples/RAPIDS-accelerated-UDFs \
            -e HOME=/tmp \
            -e CCACHE_DIR=/cache/native/ccache -e CCACHE_BASEDIR=/workspace \
            -e CPM_SOURCE_CACHE=/cache/native/cpm \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            --entrypoint /bin/bash udf-ci:local -c '
              set -eo pipefail
              source "/opt/rh/gcc-toolset-${TOOLSET_VERSION}/enable"
              set -u
              # The existing CMake file reads CXX directly; supply the active toolset path.
              export CC CXX
              CC=$(command -v gcc)
              CXX=$(command -v g++)
              export JAVA_HOME
              JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
              ccache --max-size=500M
              ccache --zero-stats
              trap "ccache --show-stats" EXIT

              # A100, L4/L40G, H100/H200, RTX PRO 6000; retain PTX for newer GPUs.
              mvn -B clean package -Pudf-native-examples \
                -DUSE_PREBUILT_CUDF=ON -DGPU_ARCHS="80-real;89-real;90-real;120" \
                -DCPP_PARALLEL_LEVEL="$(nproc)" -Dmaven.repo.local=/cache/maven
              udf_jars=(target/rapids-4-spark-udf-examples*.jar)
              [[ ${#udf_jars[@]} -eq 1 ]]
              jar tf "${udf_jars[0]}" | grep -Fx "amd64/Linux/libudfexamplesjni.so"

              # The UDF jar does not bundle these shared libraries; the GPU worker needs both.
              mkdir -p target/native-runtime
              cp -L target/cpp-build/_deps/rmm-build/librmm.so \
                target/cpp-build/_deps/rapids_logger-build/librapids_logger.so \
                target/native-runtime/
            '
          printf '%s\n' "$GITHUB_SHA" > target/gpu-ci-source-sha.txt
      - name: Upload test artifacts
        id: artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gpu-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/rapids-4-spark-udf-examples*.jar
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/dependency/rapids-4-spark*.jar
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/native-runtime/*.so
            examples/UDF-Examples/RAPIDS-accelerated-UDFs/target/gpu-ci-source-sha.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  gpu-test:
    name: UDF tests
    needs: build
    runs-on: ubuntu-latest
    # Six 10-minute queues, one 15-minute test run, and startup/cleanup overhead.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
    steps:
      # Only the shared action receives write access; this job never executes PR code.
      - name: Run UDF tests with queue fallback
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback@main
        with:
          workflow: gpu-ci-worker.yml
          # Full-SHA approval covers this copied branch's worker definition as well as its tests.
          workflow-ref: ${{ github.ref_name }}
          source-ref: ${{ github.ref }}
          source-sha: ${{ github.sha }}
          workload: ${{ toJSON(needs.build.outputs) }}
          # Common owns the Linux amd64 single-GPU pools; only queued workers can fall back.
          runner-type: gpu-amd64
          queue-timeout-minutes: '10'
          execution-timeout-minutes: '15'

  # After the common action is merged and both paths are validated, require
  # "GPU CI gate" on main, not the worker check. Keep signoff-check required too.
  # always() reports failures even when a prerequisite failed or was skipped.
  # New suites need catalog entries, workload jobs, and direct needs entries here.
  gate:
    name: GPU CI gate
    if: always() && github.repository == 'NVIDIA/cudf-spark-examples'
    needs: [select, build, gpu-test]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check selected suite results
        uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.select.outputs.required-jobs }}
