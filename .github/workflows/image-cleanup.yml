name: Image cleanup
on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report candidates without deleting versions
        type: boolean
        default: true

permissions:
  contents: read

# Share the publisher's lock; cleanup never overlaps publication or tag promotion.
concurrency:
  group: udf-native-image
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    if: >-
      github.repository == 'NVIDIA/cudf-spark-examples' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean old build-only image versions
        uses: NVIDIA/spark-rapids-common/ghcr-cleanup@main
        with:
          package: cudf-spark-examples/udf-native-toolchain
          tag-patterns: '["build-*"]'
          retention-days: '7'
          max-delete: '20'
          dry-run: ${{ github.event_name != 'schedule' && inputs.dry-run }}
