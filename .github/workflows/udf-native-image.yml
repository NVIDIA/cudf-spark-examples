name: UDF native toolchain image

# Publish build tools from trusted main; PR builds still compile their own UDFs.
# The stable :main tag carries Dockerfile-version metadata checked before reuse.
# If anonymous access is denied, check GHCR package visibility before rerunning.
# Until the image is available, PR builds use the Dockerfile/local-cache fallback.
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/udf-native-image.yml
      - examples/UDF-Examples/RAPIDS-accelerated-UDFs/Dockerfile
      - examples/UDF-Examples/RAPIDS-accelerated-UDFs/ci/native-toolchain.sh
      - examples/UDF-Examples/RAPIDS-accelerated-UDFs/ci/native-toolchain-smoke.sh
      - examples/UDF-Examples/RAPIDS-accelerated-UDFs/ci/build-udfs.sh

permissions:
  contents: read

concurrency:
  group: udf-native-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'NVIDIA/cudf-spark-examples' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Resolve native image configuration
        id: image
        run: |
          config=$(bash examples/UDF-Examples/RAPIDS-accelerated-UDFs/ci/native-toolchain.sh config)
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
      - name: Build, verify and publish native toolchain
        uses: NVIDIA/spark-rapids-common/container-image@main
        with:
          config: ${{ steps.image.outputs.config }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
